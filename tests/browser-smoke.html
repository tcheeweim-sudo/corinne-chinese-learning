<!doctype html>
<meta charset="utf-8">
<title>V0.2 local browser smoke checks</title>
<style>body{font-family:system-ui;margin:20px}button{padding:10px;margin:4px}pre{white-space:pre-wrap}iframe{display:block;margin-top:12px;border:1px solid #aaa}</style>
<h1>V0.2 local browser smoke checks</h1>
<p>Run only on the local test server. Progress is backed up and restored.</p>
<button id="run">Run functional checks</button>
<button id="inspect">Inspect offline cache</button>
<pre id="results" aria-live="polite"></pre>
<iframe id="app" title="App under test" style="width:390px;height:844px"></iframe>
<script>
const frame = document.getElementById('app');
const output = document.getElementById('results');
const log = message => { output.textContent += message + '\n'; };
const assert = (condition, message) => { if (!condition) throw Error(message); };
const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
const load = () => new Promise(resolve => { frame.onload = resolve; frame.src = '../?smoke=' + Date.now(); });
const savedState = () => JSON.parse(localStorage.getItem('corinne-zh-v0'));

document.getElementById('run').onclick = async () => {
  if (!['127.0.0.1', 'localhost'].includes(location.hostname)) return log('Run this page on the local test server.');
  const backup = localStorage.getItem('corinne-zh-v0');
  output.textContent = '';
  try {
    localStorage.removeItem('corinne-zh-v0');
    await load();
    let win = frame.contentWindow, doc = frame.contentDocument;
    const click = id => doc.getElementById(id).click();
    const answer = (wrongFirst = false) => {
      const mission = win.AppDebug.store.state.mission;
      const item = win.CURRICULUM.find(entry => entry.id === mission.focusIds[mission.stageIndex]);
      const choices = [...doc.querySelectorAll('#choiceGrid button')];
      if (wrongFirst) choices.find(button => button.textContent !== item.target).click();
      const correct = choices.find(button => button.textContent === item.target);
      assert(correct, `No matching choice at ${mission.stage} ${mission.stageIndex} answered=${mission.stageAnswered}: ${item?.target}; choices=${choices.map(button => button.textContent).join('|')}`);
      correct.click();
      const lockedCoins = win.AppDebug.store.state.coins;
      correct.click();
      assert(win.AppDebug.store.state.coins === lockedCoins, 'Repeated answer charged a reward');
    };

    click('startMission'); click('introNext');
    const focusCount = win.AppDebug.store.state.mission.focusIds.length;
    for (let i = 0; i < focusCount; i++) click('stageNext');
    answer(true); click('questionNext');
    const beforeReload = savedState();
    await load(); win = frame.contentWindow; doc = frame.contentDocument;
    assert(win.AppDebug.store.state.mission.stage === 'recognise' && win.AppDebug.store.state.mission.stageIndex === 1, 'Guided mission did not resume');
    assert(savedState().questionMetrics.attempted === 1 && savedState().questionMetrics.responses === 2, 'Question/response counts were conflated');
    click('startMission');
    for (let i = 1; i < focusCount; i++) { answer(); click('questionNext'); }
    assert(win.AppDebug.store.state.mission.stage === 'write', 'Mission did not advance to writing');
    assert(doc.querySelector('#characterTarget svg'), 'Hanzi Writer did not render');
    click('showStrokes'); click('startWriting');
    assert(doc.getElementById('writingFeedback').textContent.includes('Write the character'), 'Writing quiz did not start');

    const sizes = [];
    for (const [width, height] of [[390, 844], [768, 1024], [1024, 768]]) {
      frame.style.width = width + 'px';
      frame.style.height = height + 'px';
      win.dispatchEvent(new Event('orientationchange'));
      await pause(140); win.AppDebug.resizeWriter();
      sizes.push(Number(doc.querySelector('#characterTarget svg').getAttribute('width')));
    }
    assert(sizes.every(size => size > 200 && size <= 360) && sizes[1] >= sizes[0], `Writer sizing failed: ${sizes.join(', ')}`);
    log('PASS: guided mission resume, response metrics, anti-farming, writing start/stroke animation and phone/tablet orientation sizing');

    // Continue at recall so the smoke check can finish without simulating handwriting strokes.
    const mission = win.AppDebug.store.state.mission;
    mission.stage = 'recall'; mission.stageIndex = 0; mission.stageAnswered = false; mission.questionTries = 0;
    win.AppDebug.store.save(); win.AppDebug.show('mission');
    for (let i = 0; i < focusCount; i++) { answer(); click('questionNext'); }
    const completedCoins = win.AppDebug.store.state.coins;
    assert(win.AppDebug.store.state.mission.rewardClaimed && win.AppDebug.store.state.streak === 1, 'Mission reward/streak failed');
    await load(); win = frame.contentWindow; doc = frame.contentDocument;
    assert(win.AppDebug.store.state.coins === completedCoins, 'Reload duplicated mission completion reward');
    win.AppDebug.show('parent');
    assert(doc.getElementById('parentSummary').textContent.includes('Answer responses'), 'Parent response metric missing');
    log('PASS: recall, mission reward anti-farming, streak, parent metrics and local reload');

    win.AppDebug.show('house');
    const pillow = [...doc.querySelectorAll('.shop-item')].find(card => card.textContent.includes('Cloud Pillow'));
    pillow.querySelector('button').click();
    const afterPurchase = win.AppDebug.store.state.coins;
    assert(win.AppDebug.store.state.tigerHouse.owned.includes('cloud-pillow'), 'Purchase did not persist in state');
    const duplicate = win.TigerHouse.purchase(win.AppDebug.store.state, 'cloud-pillow');
    assert(!duplicate.ok && win.AppDebug.store.state.coins === afterPurchase, 'Duplicate purchase charged twice');
    await load(); win = frame.contentWindow;
    assert(win.AppDebug.store.state.tigerHouse.slots.pillow === 'cloud-pillow', 'Tiger House placement did not survive reload');
    log('PASS: Tiger House purchase, duplicate protection and persistence');

    localStorage.setItem('corinne-zh-v0', JSON.stringify({coins:8,stars:3,badges:['old'],itemStats:{mama:{attempts:4,correct:2,writes:1,written:[0]}}}));
    await load(); win = frame.contentWindow;
    assert(win.AppDebug.store.state.coins === 8 && win.AppDebug.store.state.stars === 3, 'V0.1 rewards migration failed');
    assert(win.AppDebug.store.state.itemStats.mama.legacy.answerResponses === 4, 'V0.1 item history migration failed');
    localStorage.setItem('corinne-zh-v0', '{broken');
    await load();
    assert(frame.contentWindow.AppDebug.store.state.coins === 0, 'Malformed storage recovery failed');
    log('PASS: V0.1 migration and malformed storage recovery');
  } catch (error) { log('FAIL: ' + (error.stack || error.message)); }
  finally {
    frame.style.width = '390px';
    frame.style.height = '844px';
    if (backup === null) localStorage.removeItem('corinne-zh-v0'); else localStorage.setItem('corinne-zh-v0', backup);
    await load();
  }
};

document.getElementById('inspect').onclick = async () => {
  output.textContent = '';
  try {
    const registration = await navigator.serviceWorker.getRegistration(new URL('../', location.href));
    assert(registration?.active, 'No active service worker');
    for (let i = 0; i < 50 && (registration.installing || registration.waiting); i++) await pause(100);
    const names = (await caches.keys()).filter(name => name.startsWith('corinne-v'));
    assert(names.length === 1 && names[0] === 'corinne-v0.2.1', 'Expected only the current V0.2 cache');
    const cache = await caches.open(names[0]);
    const keys = await cache.keys();
    assert(keys.filter(request => request.url.includes('/character-data/')).length === 19, 'Expected 19 character files');
    for (const asset of ['index.html','app.js','audio.js','mission.js','progress.js','curriculum/tingxie.js','shop/tiger-house.js','tiger/assets/tiger-placeholder.svg']) {
      assert(await cache.match(new URL('../' + asset, location.href)), 'Missing cached asset: ' + asset);
    }
    log('PASS: active V0.2 worker, offline app shell and all 19 character files');
  } catch (error) { log('FAIL: ' + error.message); }
};
</script>
